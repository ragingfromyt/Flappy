name: Build Flappy Bird IPA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ios.yml'
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build native web wrapper
        run: |
          mkdir -p Payload/Flappy.app
          cat > Main.swift <<'EOF'
          import UIKit
          import WebKit
          import AVFoundation
          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions options: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {
                  do {
                      try AVAudioSession.sharedInstance().setCategory(.playback, mode: .default, options: [.mixWithOthers])
                      try AVAudioSession.sharedInstance().setActive(true)
                  } catch { print("Audio session: \(error)") }
                  let w = UIWindow(frame: UIScreen.main.bounds)
                  w.rootViewController = GameController()
                  w.makeKeyAndVisible()
                  window = w
                  return true
              }
          }
          class GameController: UIViewController {
              override var prefersStatusBarHidden: Bool { true }
              override func loadView() {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []
                  let web = WKWebView(frame: .zero, configuration: config)
                  web.scrollView.isScrollEnabled = false
                  web.scrollView.bounces = false
                  view = web
                  web.load(URLRequest(url: URL(string: "https://ragingfromyt.github.io/Flappy/")!, cachePolicy: .reloadIgnoringLocalCacheData))
              }
          }
          EOF
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc -parse-as-library -target arm64-apple-ios16.0 -sdk "$SDK" Main.swift -o Payload/Flappy.app/Flappy
          python3 - <<'PY'
          import plistlib
          with open('Payload/Flappy.app/Info.plist','wb') as f:
              plistlib.dump(dict(CFBundleExecutable='Flappy',CFBundleIdentifier='com.ragingfromyt.flappy',CFBundleName='Flappy Bird',CFBundleDisplayName='Flappy Bird',CFBundlePackageType='APPL',CFBundleVersion='1',CFBundleShortVersionString='1.0',MinimumOSVersion='16.0',CFBundleSupportedPlatforms=['iPhoneOS'],UIDeviceFamily=[1],UILaunchScreen={},UISupportedInterfaceOrientations=['UIInterfaceOrientationPortrait']),f)
          PY
          python3 generate-icons.py Payload/Flappy.app
          python3 - <<'PY'
          import plistlib
          p='Payload/Flappy.app/Info.plist'
          with open(p,'rb') as f: d=plistlib.load(f)
          d['CFBundleIcons']={'CFBundlePrimaryIcon':{'CFBundleIconFiles':['icon-120','icon-180']}}
          d['CFBundleIconFiles']=['icon-120','icon-180']
          d['CFBundleVersion']='2'
          with open(p,'wb') as f: plistlib.dump(d,f)
          PY
          zip -qr "Flappy Bird.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Flappy Bird
          path: Flappy Bird.ipa
