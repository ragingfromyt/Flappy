<body>

<div id="menu" class="screen"><h1>FLAPPY BIRD</h1><div class="card"><button class="green" onclick="showPlayers()">Play</button><button onclick="showSkins()">Skins</button><button class="gray" onclick="showSettings()">Settings</button><button class="gray" onclick="showLeaderboard()">Resultattavle</button></div><div class="version">VERSION 6.9</div></div><div id="players" class="screen hidden">

1 id="readyTitle">GET READY</h1><small id="playerTitle"></small><div id="readyText"><svg viewBox="0 0 100 80" width="76" height="60" aria-hidden="true"><g fill="#eee" stroke="#59423b" stroke-width="4"><path d="M15 25H25V15H65V22H80V48H65V60H25V50H15Z"/><path d="M50 15H70V35H50Z" fill="white"/><path d="M70 38H90V49H70Z" fill="#d96118"/><path d="M15 35H40V48H15Z"/></g><path d="M60 20V30" stroke="#333" stroke-width="5"/></svg><div class="tapArrow">↑</div><div class="tapLabel">TAP</div></div></div>

<script>

const $ = id => document.getElementById(id);

const canvas = $("game");
const ctx = canvas.getContext("2d", {alpha:false});

let W = 0;
let H = 0;
let DPR = 1;
let groundHeight = 65;

let player = "Ivan";
let state = "menu";

let bird;
let pipes = [];
let score = 0;
let roundCoins=0;
let roundBest = 0;
let groundOffset = 0;

let dirty = true;

const PHYSICS_HZ = 120;
const STEP = 1 / PHYSICS_HZ;

const GRAVITY = 1250;
const JUMP = -390;
const PIPE_WIDTH = 65;

let profiles = {
  Ivan: { best: 0, games: 0, coins: 0 },
  Alva: { best: 0, games: 0 }
};

try {

  const saved = JSON.parse(
    localStorage.getItem("flappyProfilesV3")
  );

  if (saved && saved.Ivan && saved.Alva) {
    for(const n of ["Ivan","Alva"]){profiles[n]={best:Math.max(0,Math.floor(Number(saved[n].best)||0)),games:Math.max(0,Math.floor(Number(saved[n].games)||0)),coins:Math.max(0,Math.floor(Number(saved[n].coins)||0))};}
  }

} catch(e) {}

function saveProfiles() {

  try {

    localStorage.setItem(
      "flappyProfilesV3",
      JSON.stringify(profiles)
    );

  } catch(e) {}
}

function resize(force=false) {

  const rect = canvas.getBoundingClientRect();

  if (!rect.width || !rect.height) return;

  if (!force && rect.width === W && rect.height === H) return;

  const oldH = H;

  W = rect.width;
  H = rect.height;

  DPR = prefs.graphics==="pixel"?Math.min(1,288/W):Math.min(window.devicePixelRatio || 1, 1.5);

  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);ctx.imageSmoothingEnabled=prefs.graphics!=="pixel";

  groundHeight = Math.round(H * 0.17);

  if (bird) {

    bird.x = W * 0.25;

    bird.y = oldH
      ? bird.y * H / oldH
      : H * 0.43;

  }

  dirty = true;
}

function showScreen(id) {

  const screens = [
    "menu", "players", "skins", "settings", "names",
    "ready", "pauseMenu",
    "gameover",
    "leaderboard",
    "hud"
  ];

  for (const screen of screens) {

    $(screen).classList.toggle(
      "hidden",
      screen !== id
    );

  }

  $("pauseButton").classList.toggle("hidden",id!=="hud"&&id!=="ready");
  dirty = true;
}

let pausedFrom="playing";
function pauseGame(){if(state!=="playing"&&state!=="ready")return;pausedFrom=state;state="paused";showScreen("pauseMenu");}
function resumeGame(){if(state!=="paused")return;state=pausedFrom;accumulator=0;lastTime=0;showScreen(state==="ready"?"ready":"hud");}

function showMenu() {

  state = "menu";

  pipes = [];

  $("ivanBest").textContent =
    "Rekord: " + profiles.Ivan.best;

  $("alvaBest").textContent =
    "Rekord: " + profiles.Alva.best;

  showScreen("menu");
}

const skins={Classic:["#FFD744","#FFF0B0"],Pink:["#F4A2D1","#FFD3EB"],Ocean:["#369BFF","#BCE8FF"],Emerald:["#36C98A","#B8F5CF"],Shadow:["#394150","#A0A9BB"],Ruby:["#E94B4B","#FFB5A8"]};
let prefs={theme:"day",graphics:"smooth",fps:120,music:false,sound:true,skins:{Ivan:"Classic",Alva:"Pink"}};
try{const p=JSON.parse(localStorage.getItem("flappySettingsV5"));if(p){prefs.theme=p.theme==="night"?"night":"day";prefs.graphics=p.graphics==="pixel"?"pixel":"smooth";prefs.fps=p.fps===60?60:120;prefs.music=p.music===true;prefs.sound=p.sound!==false;for(const n of ["Ivan","Alva"])if(p.skins&&skins[p.skins[n]])prefs.skins[n]=p.skins[n];}}catch(e){}
function savePrefs(){try{localStorage.setItem("flappySettingsV5",JSON.stringify(prefs));}catch(e){}}
function showPlayers(){state="players";$("ivanLabel").textContent=names.Ivan;$("alvaLabel").textContent=names.Alva;for(const n of ["Ivan","Alva"])$(n.toLowerCase()+"Best").textContent="Rekord: "+profiles[n].best;showScreen("players");}
let names={Ivan:"Ivan",Alva:"Alva"};try{const n=JSON.parse(localStorage.getItem("flappyNames"));for(const k of ["Ivan","Alva"])if(typeof n?.[k]==="string"&&n[k].trim())names[k]=n[k].trim().slice(0,18);}catch(e){}
function showNames(){state="names";$("name1").value=names.Ivan;$("name2").value=names.Alva;showScreen("names");}
function saveNames(){names.Ivan=$("name1").value.trim()||"Ivan";names.Alva=$("name2").value.trim()||"Alva";try{localStorage.setItem("flappyNames",JSON.stringify(names));}catch(e){}showSettings();}
let skinPlayer="Ivan";
function makeButton(parent,label,action,color){const b=document.createElement("button");b.textContent=label;b.style.width="47%";b.style.margin="3px";b.style.padding="10px";b.style.background=color;b.classList.toggle("activeChoice",color==="#3478e5");b.onclick=action;parent.appendChild(b);}
function showSkins(){state="skins";showScreen("skins");const chosen=prefs.skins[skinPlayer],colors=skins[chosen];$("previewBody").setAttribute("fill",colors[0]);$("previewWing").setAttribute("fill",colors[1]);$("selectedSkin").textContent=names[skinPlayer]+" – "+chosen;const p=$("skinPlayers"),s=$("skinChoices");p.replaceChildren();s.replaceChildren();for(const n of ["Ivan","Alva"])makeButton(p,names[n],()=>{skinPlayer=n;showSkins();},n===skinPlayer?"#3478e5":"#344b5b");for(const [n,c] of Object.entries(skins)){makeButton(s,n+(prefs.skins[skinPlayer]===n?" ✓":""),()=>{prefs.skins[skinPlayer]=n;savePrefs();showSkins();},"#344b5b");s.lastChild.style.border="4px solid "+c[0];}}
async function checkUpdate(){const b=$("updateButton"),s=$("updateStatus");b.disabled=true;s.textContent="Sjekker etter oppdatering…";try{const u=new URL("./index.html",location.href);u.searchParams.set("_update",Date.now());const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const html=await r.text();const v=html.match(/VERSION (\d+\.\d+)/)?.[1];if(!v)throw Error("Version missing");const current="6.9";const parts=v.split(".").map(Number),cur=current.split(".").map(Number);if(parts[0]>cur[0]||(parts[0]===cur[0]&&parts[1]>cur[1])){s.textContent="Ny versjon "+v+" funnet. Oppdaterer…";const next=new URL(location.href);next.searchParams.set("_update",Date.now());location.replace(next.href);}else{s.textContent="Du har nyeste publiserte versjon ("+current+").";}}catch(e){s.textContent="Kunne ikke sjekke. Prøv igjen senere.";}finally{b.disabled=false;}}
function setVisual(k,v){prefs[k]=v;savePrefs();applyVisual();showSettings();}
function applyVisual(){const sky=prefs.theme==="night"?"#192b49":"#80c5ce";document.documentElement.style.setProperty("--sky",sky);document.documentElement.style.backgroundColor=sky;document.body.style.backgroundColor=sky;document.querySelector('meta[name="theme-color"]').content=sky;document.body.classList.toggle("night",prefs.theme==="night");canvas.classList.toggle("pixel",prefs.graphics==="pixel");resize(true);cacheBackground();dirty=true;}
function showSettings(){for(const k of ["day","night","smooth","pixel"])$(k).classList.toggle("activeChoice",k===prefs.theme||k===prefs.graphics);$("soundToggle").textContent="Hoppelyd: "+(prefs.sound?"PÅ":"AV");state="settings";showScreen("settings");$("musicToggle").textContent="Musikk: "+(prefs.music?"PÅ":"AV");for(const f of [60,120])$("fps"+f).classList.toggle("activeChoice",prefs.fps===f);}
function setFPS(f){prefs.fps=f;savePrefs();showSettings();}
let audio=null,musicTimer=null,musicStep=0;
let effectsAudio=null;
function toggleSound(){prefs.sound=!prefs.sound;savePrefs();if(prefs.sound)flapSound();showSettings();}
function flapSound(){if(!prefs.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!effectsAudio)effectsAudio=new AC();const play=()=>{const t=effectsAudio.currentTime,o=effectsAudio.createOscillator(),g=effectsAudio.createGain();o.type="triangle";o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(980,t+.065);o.frequency.exponentialRampToValueAtTime(680,t+.11);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.16,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(g);g.connect(effectsAudio.destination);o.start(t);o.stop(t+.14);};if(effectsAudio.state==="running")play();else effectsAudio.resume().then(play).catch(()=>{});}catch(e){}}
const melody=[60,64,67,72,67,64,62,65,69,74,69,65,59,62,67,71];
function stopMusic(){if(musicTimer!==null){clearInterval(musicTimer);musicTimer=null;}if(audio&&audio.state==="running")audio.suspend().catch(()=>{});}
function startMusic(){if(!prefs.music||document.hidden||musicTimer!==null)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio)audio=new AC();audio.resume().catch(()=>{});const note=()=>{if(audio.state!=="running")return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type="triangle";o.frequency.value=440*Math.pow(2,(melody[musicStep++%melody.length]-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.23);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.25);};note();musicTimer=setInterval(note,300);}catch(e){}}
function toggleMusic(){prefs.music=!prefs.music;savePrefs();if(prefs.music)startMusic();else stopMusic();showSettings();}
document.addEventListener("click",()=>{if(prefs.music)startMusic();});
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopMusic();else if(prefs.music)startMusic();});
function selectPlayer(name) {

  player = name;

  prepareGame();
}

function prepareGame() {

  state = "ready";

  score = 0;
  roundCoins=0; $("coinHud").textContent="★ 0";
  roundBest = profiles[player].best;
  pipes = [];
  groundOffset = 0;

  bird = {
    x: W * 0.25,
    y: H * 0.43,
    velocity: 0,
    radius: 14
  };

  $("playerTitle").textContent = names[player];
  $("playerName").textContent = names[player];
  $("score").textContent = "0";

  $("bestHud").textContent =
    "BEST: " + profiles[player].best;

  showScreen("ready");
}

function startGame() {

  state = "playing";
  profiles[player].games++;saveProfiles();

  showScreen("hud");

  bird.velocity = JUMP;
  flapSound();

  createPipe();
}

document.addEventListener("pointerdown", e => {

  if (e.target.closest("button")) return;

  if (state === "ready") {

    e.preventDefault();

    startGame();

  } else if (state === "playing") {

    e.preventDefault();

    bird.velocity = JUMP;
  flapSound();

  }

}, { passive: false });

function createPipe() {

  const playHeight = H - groundHeight;

  const gap = Math.min(
    playHeight * 0.45,
    Math.max(155, 205 - score * 1.3)
  );

  const minTop = 35;

  const maxTop = Math.max(
    minTop,
    playHeight - gap - 35
  );

  let top = minTop +
    Math.random() * (maxTop - minTop);

  if (pipes.length > 0) {

    const previous = pipes[pipes.length - 1].top;

    const difference = 75 + Math.random() * 85;

    top = previous < (minTop + maxTop) / 2
      ? previous + difference
      : previous - difference;
  }

  top = Math.max(
    minTop,
    Math.min(maxTop, top)
  );

  pipes.push({
    x: W + 10,
    top: top,
    gap: gap,
    coinTaken: false,
    passed: false
  });
}

function gameOver() {

  if (state !== "playing") return;

  state = "dead";

  const profile = profiles[player];



  const newRecord = score > roundBest;

  profile.best = Math.max(
    profile.best,
    score
  );

  saveProfiles();

  $("resultPlayer").textContent = names[player];

  $("resultScore").textContent = score;
  $("resultCoins").textContent="★ "+roundCoins+" COINS";

  $("resultBest").textContent = profile.best;
  $("newRecord").classList.toggle("hidden", !newRecord);
  $("medalIcon").style.background = score>=40?"#f7cc55":score>=20?"#e9e6d7":score>=10?"#c98d55":"#dcd894";

  showScreen("gameover");
}

function showLeaderboard() {

  state = "leaderboard";

  const sorted = Object.entries(profiles)
    .sort((a, b) => b[1].best - a[1].best);

  $("ranking").innerHTML = sorted.map(
    ([name, profile], index) =>

      '<div class="row">' +
      '<div style="text-align:left">' +
      (index + 1) + ". " + names[name].replace(/[&<>"\x27]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\x27":"&#39;"}[c])) +
      '<small>' +
      profile.games +
      ' spilte runder · ★ '+(profile.coins||0)+'</small></div>' +
      '<strong>' +
      profile.best +
      '</strong></div>'

  ).join("");

  showScreen("leaderboard");
}

function update() {

  if (state !== "playing") return;

  const speed = Math.min(
    275,
    155 + score * 2
  );

  groundOffset += speed * STEP;

  bird.velocity += GRAVITY * STEP;

  bird.y += bird.velocity * STEP;

  if (
    pipes.length === 0 ||
    pipes[pipes.length - 1].x < W - 245
  ) {

    createPipe();

  }

  for (const p of pipes) {

    p.x -= speed * STEP;

    const overlap =
      bird.x + bird.radius > p.x - 4 &&
      bird.x - bird.radius <
        p.x + PIPE_WIDTH + 4;

    if (
      overlap &&
      (
        bird.y - bird.radius < p.top ||
        bird.y + bird.radius > p.top + p.gap
      )
    ) {

      gameOver();

      return;

    }

    if(!p.coinTaken && Math.hypot(bird.x-(p.x+PIPE_WIDTH/2),bird.y-(p.top+p.gap/2)) < bird.radius+12){p.coinTaken=true;roundCoins++;profiles[player].coins=(profiles[player].coins||0)+1;saveProfiles();$("coinHud").textContent="★ "+roundCoins;}
    if (
      !p.passed &&
      p.x + PIPE_WIDTH + 4 <
        bird.x - bird.radius
    ) {

      p.passed = true;

      score++;

      $("score").textContent = score;
      if(score > profiles[player].best){profiles[player].best=score;saveProfiles();}
      $("bestHud").textContent="BEST: "+profiles[player].best;

    }
  }

  while (
    pipes.length &&
    pipes[0].x < -80
  ) {

    pipes.shift();

  }

  if (
    bird.y - bird.radius < 0 ||
    bird.y + bird.radius > H - groundHeight
  ) {

    gameOver();

  }
}

function rectangle(x, y, w, h, color) {

  if (h <= 0) return;

  ctx.fillStyle = color;

  ctx.fillRect(x, y, w, h);
}

function ellipse(x, y, rx, ry, color) {

  ctx.fillStyle = color;

  ctx.beginPath();

  ctx.ellipse(
    x, y, rx, ry,
    0, 0, Math.PI * 2
  );

  ctx.fill();
}

function pipeSection(x, y, w, h) {
if(prefs.graphics==="pixel"){if(h<=0)return;rectangle(x,y,w,h,"#493d35");rectangle(x+3,y+3,w-6,Math.max(0,h-6),"#80bf28");rectangle(x+7,y+3,7,Math.max(0,h-6),"#d1ef70");rectangle(x+w-12,y+3,7,Math.max(0,h-6),"#43821e");return;}

  if (h <= 0) return;

  rectangle(x, y, w, h, "#57B936");

  rectangle(
    x + 5, y, 8, h, "#A4E86B"
  );

  rectangle(
    x + w - 9, y, 9, h, "#328A28"
  );

  ctx.strokeStyle = "#286822";

  ctx.lineWidth = 2;

  ctx.strokeRect(x, y, w, h);
}

function drawPipes() {

  for (const p of pipes) {

    const bottom = p.top + p.gap;

    pipeSection(
      p.x, 0,
      PIPE_WIDTH, p.top
    );

    pipeSection(
      p.x - 4,
      p.top - 22,
      PIPE_WIDTH + 8,
      22
    );

    pipeSection(
      p.x,
      bottom,
      PIPE_WIDTH,
      H - groundHeight - bottom
    );

    pipeSection(
      p.x - 4,
      bottom,
      PIPE_WIDTH + 8,
      22
    );

  }
}

function drawGround() {
 const y=H-groundHeight;
 rectangle(0,y,W,groundHeight,"#ded994");
 rectangle(0,y,W,3,"#514737");
 rectangle(0,y+3,W,3,"#e7f5a1");
 rectangle(0,y+6,W,12,"#85c83d");
 for(let x=-(groundOffset%24)-24;x<W;x+=24){
   for(let j=0;j<12;j+=3)rectangle(x+12-j,y+6+j,12,3,"#b9e65d");
 }
 rectangle(0,y+18,W,3,"#527e29");
 rectangle(0,y+21,W,4,"#bd9750");
 rectangle(0,y+Math.round(groundHeight*.52),W,7,"#b5c56b");
 rectangle(0,y+Math.round(groundHeight*.52)+7,W,8,"#d4ce87");

}

function drawBird(time) {

  if (!bird) return;

  const bob = state === "ready"
    ? Math.sin(time * 0.005) * 6
    : 0;

  ctx.save();

  ctx.translate(
    bird.x,
    bird.y + bob
  );

  ctx.rotate(
    Math.max(
      -0.4,
      Math.min(1, bird.velocity / 650)
    )
  );

  if(prefs.graphics==="pixel"){const c=skins[prefs.skins[player]];const rows=["....KKKKK.......","..KKBBBBBKK.....",".KBBBBBBWWKK....","KBBBBBBBWWPWK...","KBBBBBBBWWPWK...","KLLLLBBBWWWWK...","KLLLLLBBBBKKKKKK",".KLLLBBBBKRRRRRK","..KBBBBBBKKKKKKK","...KKBBBBKRRRRK.",".....KKKKKKKKK.."];const pal={K:"#49362e",B:c[0],L:c[1],W:"#fff",P:"#222",R:"#e35b36"};for(let y=0;y<rows.length;y++)for(let x=0;x<rows[y].length;x++){const col=pal[rows[y][x]];if(col)rectangle(x*3-24,y*3-16,3,3,col);}ctx.restore();return;}
  ellipse(
    0, 0, 20, 15,
    skins[prefs.skins[player]][0]
  );

  ctx.save();

  ctx.translate(-10, 4);

  ctx.rotate(
    Math.sin(time * 0.025) * 0.35
  );

  ellipse(
    0, 0, 10, 6,
    skins[prefs.skins[player]][1]
  );

  ctx.restore();

  ellipse(10, -6, 9, 9, "#FFFFFF");

  ellipse(13, -6, 3.5, 3.5, "#20252A");

  ellipse(19, 4, 8, 4, "#FF8B31");

  ctx.restore();
}

function drawBackground() {
 const night=prefs.theme==="night";
 if(prefs.graphics==="pixel"){rectangle(0,0,W,H,night?"#192b49":"#80c5ce");const y=H-groundHeight; if(night){for(let i=0;i<32;i++)rectangle((i*73+19)%W,(i*47+13)%(H*.62),2,2,"#e7e8bd");}for(let i=-1;i<W/42+1;i++){let x=i*42;rectangle(x,y-120-(i%3+3)%3*12,48,125,night?"#354d65":"#e3f5c8");}for(let i=0;i<W/23;i++){let x=i*23,bh=32+(i*17)%60;rectangle(x,y-22-bh,20,bh,night?"#283d56":"#a5d7c9");for(let j=0;j<bh-8;j+=12)rectangle(x+5,y-18-bh+j,4,5,night?"#d5b86a":"#d7edc6");}for(let i=-1;i<W/28+1;i++){rectangle(i*28,y-23-(i%2)*8,32,32,night?"#294d45":"#83d77c");}return;}

  rectangle(0, 0, W, H, night?"#192b49":"#80c5ce");

  ellipse(
    W * 0.8,
    H * 0.12,
    35, 35,
    night?"#e7e8d9":"#FFF1B2"
  );

  for (let i = 0; i < 4; i++) {

    const x = (i * 137 + 35) % W;

    const y = H * (0.15 + i * 0.13);

    ellipse(
      x - 25, y,
      24, 20, night?"#63738b88":"#FFFFFFAA"
    );

    ellipse(
      x, y - 10,
      30, 26, night?"#63738b88":"#FFFFFFAA"
    );

    ellipse(
      x + 25, y,
      24, 20, night?"#63738b88":"#FFFFFFAA"
    );

  }
}

let background = null;

function cacheBackground() {

  background = document.createElement("canvas");

  background.width = canvas.width;
  background.height = canvas.height;

  drawBackground();

  const b = background.getContext("2d");

  b.drawImage(canvas, 0, 0);
}

function drawCoins(){
 for(const p of pipes){
  if(p.coinTaken||p.x>W||p.x+PIPE_WIDTH<0)continue;
  const x=p.x+PIPE_WIDTH/2,y=p.top+p.gap/2;
  ellipse(x,y,13,13,"#754615");
  ellipse(x,y,11,11,"#ffcf39");
  ellipse(x,y,8.5,8.5,"#e9a51b");
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?3:7;const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  ctx.closePath();ctx.fillStyle="#fff1a0";ctx.fill();
 }
}
function draw(time) {

  if (background) {

    ctx.drawImage(
      background,
      0, 0, W, H
    );

  }

  drawPipes();
  drawCoins();

  drawGround();


  if (
    state === "ready" ||
    state === "playing" ||
    state === "dead" || state === "paused"
  ) {

    drawBird(time);

  }
}

let lastTime = 0;
let accumulator = 0;

let lastDraw=null;
let fpsFrames = 0;
let fpsTime = 0;

function loop(time) {

  const realDt = lastTime
    ? (time - lastTime) / 1000
    : 0;

  lastTime = time;

  const dt = Math.min(realDt, 0.05);

  accumulator += dt;

  while (accumulator >= STEP) {

    update();

    accumulator -= STEP;

  }

  const interval=1000/prefs.fps;
  const elapsed=lastDraw===null?interval:time-lastDraw;
  const rendered=dirty||((state==="playing"||state==="ready")&&(prefs.fps===120||elapsed>=interval-0.7));
  if(rendered){draw(time);dirty=false;lastDraw=lastDraw===null||elapsed>interval*3?time:time-Math.max(0,elapsed-interval);}

  if (state === "playing") {

    if(rendered) fpsFrames++;

    fpsTime += realDt;

    if (fpsTime >= 0.5) {

      // FPS counter stays hidden; avoid unnecessary DOM writes.

      fpsFrames = 0;
      fpsTime = 0;

    }

  } else {

    fpsFrames = 0;
    fpsTime = 0;

  }

  requestAnimationFrame(loop);
}

function handleResize() {

  resize();

  if (W > 0 && H > 0) {

    cacheBackground();

    dirty = true;

  }
}

window.addEventListener(
  "resize",
  handleResize
);

if (window.visualViewport) {

  window.visualViewport.addEventListener(
    "resize",
    handleResize
  );

}

window.addEventListener("pagehide",()=>{saveProfiles();savePrefs();});
document.addEventListener("visibilitychange",()=>{if(document.hidden){saveProfiles();savePrefs();}});
applyVisual();

showMenu();

requestAnimationFrame(loop);

</script>
